worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 15;

  upstream app {
    server 127.0.0.1:3000;
  }

  server {
    listen 8080;
    server_name _;

    # Must stay reachable when nginx has pulled the upstream, or C4 cannot restore.
    location /debug/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    # nginx pulls the upstream when /readyz fails: the watcher touches this file.
    location / {
      if (-f /tmp/app-not-ready) {
        return 503;
      }
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_read_timeout 60s;
    }

    location /nginx-health {
      if (-f /tmp/app-not-ready) {
        return 503;
      }
      return 200 'upstream-ready\n';
    }
  }
}
