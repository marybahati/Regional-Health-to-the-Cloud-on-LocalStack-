name: Rehost Golden Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy
        required: true
        default: service-b
        type: choice
        options:
          - service-a
          - service-b
          - service-c

permissions:
  contents: read

env:
  SERVICE: service-b
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.74.0"
  ZIZMOR_VERSION: "1.29.0"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks detect --source . --verbose --redact --exit-code 1 --report-path gitleaks.json --report-format json

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version
      - name: Scan Terraform and Dockerfile
        run: |
          trivy config terraform --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-config.json
          trivy config api/Dockerfile --severity HIGH,CRITICAL --exit-code 1

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          curl -sSfL "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo install -m 0755 zizmor /usr/local/bin/zizmor
          zizmor --version
      - name: Audit workflows
        run: zizmor --persona auditor .

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Build image
        run: docker build -f api/Dockerfile -t rehost-service-b:ci .
      - name: Scan image
        run: |
          trivy image rehost-service-b:ci \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format json \
            --output trivy-image.json

  deploy:
    needs: [gitleaks, trivy-config, zizmor, trivy-image]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start LocalStack (in-runner)
        uses: LocalStack/setup-localstack@02228397f63312ffc85f293d5a4dc17188ff2b1a # main 2026-07-21
        with:
          install-wrapper: true
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - name: Build and deploy
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          AIVEN_MYSQL_HOST: ${{ secrets.AIVEN_MYSQL_HOST }}
          AIVEN_MYSQL_PORT: ${{ secrets.AIVEN_MYSQL_PORT }}
          AIVEN_MYSQL_USER: ${{ secrets.AIVEN_MYSQL_USER }}
          AIVEN_MYSQL_PASSWORD: ${{ secrets.AIVEN_MYSQL_PASSWORD }}
        run: make up SERVICE=service-b

      # E2 — OIDC design deliverable (production path, commented; no infrastructure)
      # - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/github-deploy
      #     aws-region: us-east-1
