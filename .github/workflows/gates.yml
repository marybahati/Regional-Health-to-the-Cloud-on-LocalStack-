name: Platform gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --report-path evidence/03-secrets/gitleaks.json --exit-code 1

  trivy-config:
    name: trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install trivy
        run: |
          case "$(uname -m)" in aarch64|arm64) arch=ARM64 ;; *) arch=64bit ;; esac
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-${arch}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Terraform and Dockerfile misconfig
        run: |
          mkdir -p evidence/05-gates
          trivy config --exit-code 1 --severity HIGH,CRITICAL \
            --format json --output evidence/05-gates/trivy-config-terraform.json terraform
          trivy config --exit-code 1 --severity HIGH,CRITICAL \
            --format json --output evidence/05-gates/trivy-config-api.json api

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install zizmor
        run: pipx install zizmor==1.5.2
      - name: Scan workflows
        run: zizmor --format plain .github | tee evidence/05-gates/zizmor.txt
